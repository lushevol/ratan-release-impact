# Codex reads project-scoped MCP servers from .codex/config.toml after the
# project is trusted. Keep .mcp.json in parallel for clients that use that
# convention.

[mcp_servers.openkb]
command = ".venv/bin/python"
args = [".claude/tools/mcp_trace_proxy.py", "--server", "openkb", "--", ".venv/bin/python", ".claude/tools/openkb-mcp.py", "--kb-dir", "knowledge-base"]

[mcp_servers.sdlcGraph]
command = ".venv/bin/python"
args = [".claude/tools/mcp_trace_proxy.py", "--server", "sdlcGraph", "--", ".venv/bin/python", ".claude/skills/sdlc-graph/tools/sdlc_graph_mcp.py", "--data-dir", "sdlc-graph-output", "--config", "sdlc-graph-config.json"]

[mcp_servers.gitnexusRepos]
command = ".venv/bin/python"
args = [".claude/tools/mcp_trace_proxy.py", "--server", "gitnexusRepos", "--", ".venv/bin/python", ".claude/tools/gitnexus-repos-mcp.py", "--root", "."]

# GitNexus is indexed and queried from the actual repository under repos/.
# This analysis harness deliberately does not start a root-repository server.
